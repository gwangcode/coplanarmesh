[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coplanarmesh"
version = "0.1.1"
description = "A robust 3D mesh coplanar overlap processing, adaptive remeshing and index alignment library."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "trimesh>=4.0.0",
    "numpy>=1.20.0",
    "shapely>=2.0.0",
    "triangle",
    "pymeshfix"
]

[tool.setuptools.packages.find]
where = ["src"]